# fork-kit: the central workflow in BierDav/fork-kit merges each open-noodle/gallery
# release into `patched` through one sync PR (docs/custom-fork.md). This repository
# runs only the guard.
name: fork-kit

on:
  # The guard runs the workflow as defined on the base branch and never checks
  # out the pull request's code, so the PR's content cannot change what it does.
  # labeled/unlabeled: the fork-kit:hold label takes effect at once.
  pull_request_target:
    branches: [patched]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

jobs:
  # Sets the fork-kit/hold status on every PR into the fork branch, failing
  # while it has the fork-kit:hold label (a required check). On the sync PR,
  # also turns auto-merge off when someone other than fork-kit pushed to it.
  guard:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write
      statuses: write
    concurrency:
      group: fork-kit-guard-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      # The base branch, not the pull request: nothing from the PR is executed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: BierDav/fork-kit@5d9a9773a2a47e605704346654429963d10f9698 # v0.3.1
        with:
          command: guard
          token: ${{ github.token }}
